<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IntegraDraw visual calculus workbench</title>
  <desc id="desc">An integral curve, midpoint rectangles and a numerical reference arranged beside the IntegraDraw integral mark.</desc>
  <defs>
    <pattern id="page-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f4f1ea" stroke-opacity=".055"/>
    </pattern>
    <pattern id="plot-grid" width="78" height="81" patternUnits="userSpaceOnUse">
      <path d="M78 0H0V81" fill="none" stroke="#0e1111" stroke-opacity=".11"/>
    </pattern>
    <filter id="curve-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="plot-clip">
      <rect x="578" y="82" width="548" height="488"/>
    </clipPath>
  </defs>

  <rect width="1200" height="675" fill="#0e1111"/>
  <rect width="1200" height="675" fill="url(#page-grid)"/>
  <rect x="31.5" y="31.5" width="1137" height="612" fill="none" stroke="#f4f1ea" stroke-opacity=".16"/>

  <g transform="translate(72 68)">
    <rect width="44" height="44" rx="2" fill="#f4f1ea"/>
    <g transform="scale(.6875)">
      <path class="integral-stroke" d="M47 11h-4c-8 0-12 4-13 13l-2 16c-1 9-5 13-13 13h-4" fill="none" stroke="#0e1111" stroke-width="6" stroke-linecap="round"/>
      <path class="bound-marks" d="M45 15h6v6h-6zM7 43h6v6H7z" fill="#b44a2a"/>
    </g>
  </g>
  <text x="130" y="96" fill="#f4f1ea" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing=".4">INTEGRADRAW</text>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="720" letter-spacing="-3">
    <text x="72" y="196" fill="#f4f1ea" font-size="72">See an</text>
    <text x="72" y="266" fill="#f4f1ea" font-size="72">integral</text>
    <text x="72" y="336" fill="#dd7b54" font-size="72">take shape.</text>
  </g>

  <g fill="#f4f1ea" fill-opacity=".58" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="73" y="386">Midpoint rectangles. Trapezoids.</text>
    <text x="73" y="412">A numerical reference. Error included.</text>
  </g>

  <g clip-path="url(#plot-clip)">
    <rect x="578" y="82" width="548" height="488" fill="#f4f1ea"/>
    <rect x="578" y="82" width="548" height="488" fill="url(#plot-grid)"/>

    <rect x="603" y="108" width="146" height="32" fill="#0e1111"/>
    <text x="616" y="129" fill="#f4f1ea" font-family="ui-monospace, monospace" font-size="13">f(x) = exp(−x²)</text>

    <line x1="606" y1="390" x2="1096" y2="390" stroke="#0e1111" stroke-opacity=".25" stroke-width="1.5"/>
    <g fill="#225c7e" fill-opacity=".17" stroke="#225c7e" stroke-width="1.5">
      <rect x="684" y="353" width="41" height="37"/>
      <rect x="725" y="314" width="41" height="76"/>
      <rect x="766" y="255" width="41" height="135"/>
      <rect x="807" y="206" width="41" height="184"/>
      <rect x="848" y="193" width="41" height="197"/>
      <rect x="889" y="206" width="41" height="184"/>
      <rect x="930" y="255" width="41" height="135"/>
      <rect x="971" y="314" width="41" height="76"/>
    </g>

    <path d="M642 386C690 383 719 353 760 302C800 252 823 198 869 193C915 198 938 252 978 302C1019 353 1048 383 1060 386" fill="none" stroke="#b44a2a" stroke-opacity=".24" stroke-width="20" stroke-linecap="round" filter="url(#curve-glow)"/>
    <path d="M642 386C690 383 719 353 760 302C800 252 823 198 869 193C915 198 938 252 978 302C1019 353 1048 383 1060 386" fill="none" stroke="#b44a2a" stroke-width="5" stroke-linecap="round"/>

    <text x="610" y="538" fill="#666c68" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">SIMPSON REFERENCE</text>
    <text x="998" y="540" fill="#0e1111" font-family="ui-monospace, monospace" font-size="22" font-weight="700">1.772415</text>
  </g>

  <text x="73" y="596" fill="#f4f1ea" fill-opacity=".42" font-family="ui-monospace, monospace" font-size="11" letter-spacing=".8">JAVA 17 / TYPESCRIPT / CANVAS / GITHUB PAGES</text>
</svg>
